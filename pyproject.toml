[project]
name = "chemex"
version = "2026.06.1"
description = "An analysis program for chemical exchange detected by NMR"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"  # SPDX expression
license-files = ["LICENSE.md"]  # list of paths or globs
authors = [
  { name = "Guillaume Bouvignies", email = "guillaume.bouvignies@ens.psl.eu" },
]
keywords = ["NMR", "analysis", "chemical exchange", "spectroscopy"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "annotated-types>=0.7.0",
  "cachetools>=5.5.1",
  "emcee>=3.1.6",
  "matplotlib>=3.10.0",
  "numpy>=2.2.3",
  "pydantic>=2.10.6",
  "rapidfuzz>=3.12.1",
  "rich>=13.9.4",
  "scipy>=1.18,<1.19",
]

[project.urls]
Changelog = "https://github.com/gbouvignies/ChemEx/releases"
Documentation = "https://gbouvignies.github.io/ChemEx/"
Homepage = "https://gbouvignies.github.io/ChemEx/"
Repository = "https://github.com/gbouvignies/ChemEx"

[project.scripts]
chemex = "chemex._entrypoint:main"

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  # New Ruff minor releases require an explicit policy review.
  "ruff>=0.16.0,<0.17.0",
  "scipy-stubs>=1.18.0.1",
  "ty>=0.0.65",
  "types-cachetools>=7.0.0.20260713",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]
extend-exclude = ["benchmarks"]
preview = false
required-version = ">=0.16.0,<0.17.0"

[tool.ruff.lint]
explicit-preview-rules = true
select = [
  "B",
  "BLE001",
  "C4",
  "C90",
  "DTZ",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "ISC004",
  "LOG004",
  "LOG007",
  "LOG015",
  "NPY",
  "PERF",
  "PIE",
  "PLE1205",
  "PLW1510",
  "RUF100",
  "S",
  "SIM",
  "TRY002",
  "TRY004",
  "TRY201",
  "TRY203",
  "TRY300",
  "TRY400",
  "TRY401",
  "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["chemex"]

[tool.ruff.lint.per-file-ignores]
"src/chemex/containers/data.py" = ["S311"]
"src/chemex/containers/experiments.py" = ["S311"]
"tests/**/*.py" = ["S101"]

[tool.ty.src]
include = ["src"]
exclude = ["benchmarks/"]
