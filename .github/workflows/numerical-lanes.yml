name: Diagnostic numerical lane build and attestation

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/numerical-lanes.yml"
      - "pyproject.toml"
      - "src/chemex/numerical_lanes/**"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-attest:
    name: Diagnostic Python ${{ matrix.python-version }} build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13.5"
            python-source-sha256: e6190f52699b534ee203d9f417bdbca05a92f23e35c19c691a50ed2942835385
            role: CANONICAL_NUMERICAL
            lane-name: canonical-linux-amd64-python-3.13-v1
            manifest: canonical-linux-amd64-python-3.13-v1.json
          - python-version: "3.14.5"
            python-source-sha256: 9c22bfe9939a6c5418fc74b289a5f1cc41859ae82ac6b163016b5844bd0a86bc
            role: PYTHON_COMPATIBILITY
            lane-name: compatibility-linux-amd64-python-3.14-v1
            manifest: compatibility-linux-amd64-python-3.14-v1.json
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          version: v0.36.1
          driver-opts: >-
            image=moby/buildkit:v0.26.2@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
      - name: Build exact linux/amd64 image
        run: |
          sh src/chemex/numerical_lanes/build-image.sh \
            "chemex-numerical-lane:${{ matrix.python-version }}" \
            "${{ matrix.python-version }}" \
            "${{ matrix.python-source-sha256 }}"
      - name: Capture and re-attest the built image
        run: |
          image="chemex-numerical-lane:${{ matrix.python-version }}"
          image_digest="$(docker image inspect --format '{{.Id}}' "$image")"
          docker run --rm --platform linux/amd64 "$image" \
            .venv/bin/python -m chemex.numerical_lanes capture \
            --name "${{ matrix.lane-name }}" \
            --role "${{ matrix.role }}" \
            --image-digest "$image_digest" \
            > "${{ matrix.manifest }}"
          docker run --rm --platform linux/amd64 \
            --volume "$PWD/${{ matrix.manifest }}:/tmp/lane.json:ro" \
            "$image" \
            .venv/bin/python -m chemex.numerical_lanes attest \
            --manifest /tmp/lane.json \
            --image-digest "$image_digest" \
            > "${{ matrix.manifest }}.attestation.json"
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-lane-${{ matrix.python-version }}
          path: |
            ${{ matrix.manifest }}
            ${{ matrix.manifest }}.attestation.json

  validate-compatibility:
    name: Diagnostic 3.13/3.14 structural comparison
    needs: build-and-attest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: diagnostic-lane-*
          merge-multiple: true
          path: diagnostic-lanes
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reject non-Python structural drift
        env:
          PYTHONPATH: src
        run: |
          python -m chemex.numerical_lanes validate-compatibility \
            --canonical diagnostic-lanes/canonical-linux-amd64-python-3.13-v1.json \
            --compatibility diagnostic-lanes/compatibility-linux-amd64-python-3.14-v1.json

# This hosted workflow validates recipe buildability and fail-closed attestation.
# Per #581, its artifacts are diagnostic and cannot qualify canonical evidence.
